#########################################################
# APPLICATION
#########################################################

spring.application.name=api-gateway

server.port=8080


#########################################################
# EUREKA CLIENT
#########################################################

eureka.client.enabled=true

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true


#########################################################
# SPRING CLOUD GATEWAY
#########################################################


#########################################################
# PRODUCT SERVICE ROUTE
#########################################################

spring.cloud.gateway.server.webflux.routes[0].id=product-service

spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRODUCT-SERVICE

spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/products/**


#########################################################
# INVENTORY SERVICE ROUTE
#########################################################

spring.cloud.gateway.server.webflux.routes[1].id=inventory-service

spring.cloud.gateway.server.webflux.routes[1].uri=lb://INVENTORY-SERVICE

spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/inventory/**


#########################################################
# RECOMMENDATION SERVICE ROUTE
#########################################################

spring.cloud.gateway.server.webflux.routes[2].id=recommendation-service

spring.cloud.gateway.server.webflux.routes[2].uri=lb://RECOMMENDATION-SERVICE

spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/recommendations/**

#spring.cloud.gateway.server.webflux.routes[2].filters[0]=CircuitBreaker=name=recommendationService,fallbackUri=forward:/fallback/recommendations
spring.cloud.gateway.server.webflux.routes[2].filters[0]=CircuitBreaker=recommendationCircuitBreaker,forward:/fallback/recommendations


#########################################################
# ACTUATOR
#########################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.endpoint.health.probes.enabled=true

management.health.circuitbreakers.enabled=true

management.metrics.enable.resilience4j.circuitbreaker.calls=true


#########################################################
# LOGGING
#########################################################

logging.level.root=INFO

logging.level.org.springframework.cloud.gateway=DEBUG

logging.level.org.springframework.cloud.loadbalancer=DEBUG

logging.level.com.netflix.discovery=INFO


#########################################################
# RESILIENCE4J
#########################################################


#########################################################
# RECOMMENDATION CIRCUIT BREAKER
#########################################################

resilience4j.circuitbreaker.instances.recommendationService.register-health-indicator=true

resilience4j.circuitbreaker.instances.recommendationService.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.recommendationService.sliding-window-size=5

resilience4j.circuitbreaker.instances.recommendationService.minimum-number-of-calls=3

resilience4j.circuitbreaker.instances.recommendationService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.recommendationService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.recommendationService.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.recommendationService.automatic-transition-from-open-to-half-open-enabled=true


#########################################################
# PRODUCT CIRCUIT BREAKER
#########################################################

resilience4j.circuitbreaker.instances.productService.register-health-indicator=true

resilience4j.circuitbreaker.instances.productService.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.productService.sliding-window-size=10

resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.productService.automatic-transition-from-open-to-half-open-enabled=true


#########################################################
# INVENTORY CIRCUIT BREAKER
#########################################################

resilience4j.circuitbreaker.instances.inventoryService.register-health-indicator=true

resilience4j.circuitbreaker.instances.inventoryService.sliding-window-type=COUNT_BASED

resilience4j.circuitbreaker.instances.inventoryService.sliding-window-size=10

resilience4j.circuitbreaker.instances.inventoryService.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.inventoryService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.inventoryService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.inventoryService.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.inventoryService.automatic-transition-from-open-to-half-open-enabled=true